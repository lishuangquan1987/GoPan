name: gopan_flutter
description: GoPan personal cloud drive Flutter client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  dio: ^5.7.0
  get_storage: ^2.1.1
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  open_file: ^3.5.10
  share_plus: ^10.1.4
  photo_view: ^0.15.0
  flutter_pdfview: ^1.3.2
  video_player: ^2.9.2
  flutter_highlight: ^0.7.0
  intl: ^0.20.1
  crypto: ^3.0.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  desktop_drop: ^0.4.4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
