name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux platforms
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: linux
            goarch: riscv64
            suffix: ''
          # Windows platforms
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          # macOS platforms
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          # FreeBSD platforms
          - goos: freebsd
            goarch: amd64
            suffix: ''
          - goos: freebsd
            goarch: arm64
            suffix: ''
          # OpenBSD platforms
          - goos: openbsd
            goarch: amd64
            suffix: ''
          - goos: openbsd
            goarch: arm64
            suffix: ''
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate Ent schema code
        run: |
          cd src
          go run -mod=mod entgo.io/ent/cmd/ent generate ./ent/schema

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd src
          go build -ldflags="-s -w" -o gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Create archive
        run: |
          cd src
          # Create temporary directory for files
          mkdir -p temp_archive
          # Copy only necessary files
          cp gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} temp_archive/
          cp Config.json.sample temp_archive/Config.json
          cp ../README.MD temp_archive/README.md
          # Create tar.gz archive
          tar -czvf ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.tar.gz -C temp_archive .
          # Clean up
          rm -rf temp_archive
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: src/${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.*

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: |
          ls -la ./artifacts
          find ./artifacts -type f -name "*.tar.gz" -o -name "*.zip" | sort

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
