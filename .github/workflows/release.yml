name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux platforms
          - goos: linux
            goarch: 386
            suffix: ''
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: linux
            goarch: armv5
            suffix: ''
          - goos: linux
            goarch: armv6
            suffix: ''
          - goos: linux
            goarch: armv7
            suffix: ''
          - goos: linux
            goarch: riscv64
            suffix: ''
          # Windows platforms
          - goos: windows
            goarch: 386
            suffix: '.exe'
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          # macOS platforms
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          # FreeBSD platforms
          - goos: freebsd
            goarch: 386
            suffix: ''
          - goos: freebsd
            goarch: amd64
            suffix: ''
          - goos: freebsd
            goarch: arm64
            suffix: ''
          # OpenBSD platforms
          - goos: openbsd
            goarch: 386
            suffix: ''
          - goos: openbsd
            goarch: amd64
            suffix: ''
          - goos: openbsd
            goarch: arm64
            suffix: ''
          - goos: openbsd
            goarch: armv5
            suffix: ''
          - goos: openbsd
            goarch: armv6
            suffix: ''
          - goos: openbsd
            goarch: armv7
            suffix: ''
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate Ent schema code
        run: |
          cd src
          go run -mod=mod entgo.io/ent/cmd/ent generate ./ent/schema

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd src
          go build -ldflags="-s -w" -o gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Create archive
        run: |
          cd src
          mkdir -p release
          cp gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} release/
          cp Config.json.example release/Config.json.example
          cp ../README.MD release/README.md
          cp ../Caddyfile.simple release/Caddyfile.simple
          cp ../DEPLOYMENT_SIMPLE.md release/DEPLOYMENT.md
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd release
            zip -r ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.zip .
            mv ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.zip ..
          else
            tar -czvf ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.tar.gz -C release .
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: src/${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.*

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: |
          ls -la ./artifacts
          find ./artifacts -type f -name "*.tar.gz" -o -name "*.zip" | sort

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
