name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux platforms
          - goos: linux
            goarch: 386
            suffix: ''
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: linux
            goarch: armv5
            suffix: ''
          - goos: linux
            goarch: armv6
            suffix: ''
          - goos: linux
            goarch: armv7
            suffix: ''
          - goos: linux
            goarch: riscv64
            suffix: ''
          # Windows platforms
          - goos: windows
            goarch: 386
            suffix: '.exe'
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          # macOS platforms
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          # FreeBSD platforms
          - goos: freebsd
            goarch: 386
            suffix: ''
          - goos: freebsd
            goarch: amd64
            suffix: ''
          - goos: freebsd
            goarch: arm64
            suffix: ''
          # OpenBSD platforms
          - goos: openbsd
            goarch: 386
            suffix: ''
          - goos: openbsd
            goarch: amd64
            suffix: ''
          - goos: openbsd
            goarch: arm64
            suffix: ''
          - goos: openbsd
            goarch: armv5
            suffix: ''
          - goos: openbsd
            goarch: armv6
            suffix: ''
          - goos: openbsd
            goarch: armv7
            suffix: ''
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate Ent schema code
        run: |
          cd src
          go run -mod=mod entgo.io/ent/cmd/ent generate ./ent/schema

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd src
          go build -ldflags="-s -w" -o gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Create archive
        run: |
          cd src
          mkdir -p release
          cp gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} release/
          cp Config.json.example release/Config.json.example
          cp ../README.MD release/README.md
          cp ../Caddyfile.simple release/Caddyfile.simple
          cp ../DEPLOYMENT_SIMPLE.md release/DEPLOYMENT.md
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd release
            zip -r ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.zip .
            mv ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.zip ..
          else
            tar -czvf ${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.tar.gz -C release .
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopan-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: src/${{ matrix.goos }}-${{ matrix.goarch }}-gopan-server.*

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download Linux 386 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-386
          path: ./artifacts

      - name: Download Linux AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-amd64
          path: ./artifacts

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-arm64
          path: ./artifacts

      - name: Download Linux ARMv5 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-armv5
          path: ./artifacts

      - name: Download Linux ARMv6 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-armv6
          path: ./artifacts

      - name: Download Linux ARMv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-armv7
          path: ./artifacts

      - name: Download Linux RISC-V64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-linux-riscv64
          path: ./artifacts

      - name: Download Windows 386 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-windows-386
          path: ./artifacts

      - name: Download Windows AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-windows-amd64
          path: ./artifacts

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-windows-arm64
          path: ./artifacts

      - name: Download Darwin AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-darwin-amd64
          path: ./artifacts

      - name: Download Darwin ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-darwin-arm64
          path: ./artifacts

      - name: Download FreeBSD 386 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-freebsd-386
          path: ./artifacts

      - name: Download FreeBSD AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-freebsd-amd64
          path: ./artifacts

      - name: Download FreeBSD ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-freebsd-arm64
          path: ./artifacts

      - name: Download OpenBSD 386 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-386
          path: ./artifacts

      - name: Download OpenBSD AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-amd64
          path: ./artifacts

      - name: Download OpenBSD ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-arm64
          path: ./artifacts

      - name: Download OpenBSD ARMv5 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-armv5
          path: ./artifacts

      - name: Download OpenBSD ARMv6 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-armv6
          path: ./artifacts

      - name: Download OpenBSD ARMv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: gopan-server-openbsd-armv7
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-386-gopan-server.tar.gz
            artifacts/linux-amd64-gopan-server.tar.gz
            artifacts/linux-arm64-gopan-server.tar.gz
            artifacts/linux-armv5-gopan-server.tar.gz
            artifacts/linux-armv6-gopan-server.tar.gz
            artifacts/linux-armv7-gopan-server.tar.gz
            artifacts/linux-riscv64-gopan-server.tar.gz
            artifacts/windows-386-gopan-server.zip
            artifacts/windows-amd64-gopan-server.zip
            artifacts/windows-arm64-gopan-server.zip
            artifacts/darwin-amd64-gopan-server.tar.gz
            artifacts/darwin-arm64-gopan-server.tar.gz
            artifacts/freebsd-386-gopan-server.tar.gz
            artifacts/freebsd-amd64-gopan-server.tar.gz
            artifacts/freebsd-arm64-gopan-server.tar.gz
            artifacts/openbsd-386-gopan-server.tar.gz
            artifacts/openbsd-amd64-gopan-server.tar.gz
            artifacts/openbsd-arm64-gopan-server.tar.gz
            artifacts/openbsd-armv5-gopan-server.tar.gz
            artifacts/openbsd-armv6-gopan-server.tar.gz
            artifacts/openbsd-armv7-gopan-server.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
